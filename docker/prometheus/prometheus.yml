# Prometheus 抓取与规则加载（clausewise 全栈）
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: clausewise

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 应用侧指标（审查/解析终态、模型调用时延、外发告警计数）
  - job_name: clausewise-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Worker 指标（审查/解析实际在此进程执行；prefork 多进程已做聚合）
  - job_name: clausewise-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]

  # 模型网关指标（需 master key；由 entrypoint 从环境变量写入 /tmp/litellm_key）
  - job_name: clausewise-litellm
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/litellm_key
    static_configs:
      - targets: ["litellm:4000"]
